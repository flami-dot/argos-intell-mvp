:62%;color:var(--gold);font-size:11px}.maptag{position:absolute;top:12px;left:12px;background:#091522e8;border:1px solid #385267;border-radius:7px;padding:7px;font-size:9px}.maptag.r{left:auto;right:12px;color:var(--green)}.legend{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:0 15px 13px;color:var(--muted);font-size:9px}.chart{padding:14px 18px}.chart svg{width:100%;height:185px}.insight{margin:0 15px 15px;padding:12px;background:#102923;border:1px solid #245144;border-radius:9px;color:#a5cbbb;font-size:10px;line-height:1.7}.insight b{color:#7be9c1}.bottom{display:grid;grid-template-columns:1.15fr 1fr;gap:15px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 15px;border-bottom:1px solid #192b40;font-size:10px}.table th{font-size:9px;color:#71859e;text-transform:uppercase}.table strong{display:block;color:#e8f0fa;font-size:11px;margin-bottom:4px}.status{display:inline-block;padding:5px 8px;border-radius:15px;background:#12332c;color:#64ddb0;font-size:9px}.warn{background:#302719;color:#e8bd67}.alerts{padding:0 16px}.alert{display:flex;gap:10px;padding:14px 0;border-bottom:1px solid #1b2b3f}.alert:last-child{border:0}.sym{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:#302719;color:var(--gold);flex:none}.alert strong{font-size:10px}.alert p{font-size:10px;color:var(--muted);line-height:1.6;margin:5px 0 0}.modules{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.module{padding:18px;cursor:pointer;transition:.15s}.module:hover{border-color:#42617a;transform:translateY(-2px)}.mi{font-size:21px;color:var(--green);background:#122d39;border:1px solid #244858;border-radius:10px;width:42px;height:42px;display:grid;place-items:center;margin-bottom:15px}.module h3{font-size:13px;margin:0 0 8px}.module p{font-size:11px;line-height:1.7;color:var(--muted);min-height:55px}.module footer{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;color:var(--gr function overview(){return head('GEOSPATIAL INTELLIGENCE PLATFORM','See the bigger picture. Act with clarity.','Un espace de travail unifié pour transformer les observations géospatiales en décisions concrètes.',btn('＋ New project',"go('projects')",true)+btn('Investor showcase',"go('showcase')"))+'<div class="notice"><b>ENVIRONNEMENT DE DÉMONSTRATION.</b> Les chiffres, zones, alertes et séries temporelles sont synthétiques. Aucune observation satellite en direct n’est affichée.</div><div class="kpis">'+[['Zones surveillées','12','+3 ce mois'],['Analyses disponibles','48','Tous secteurs'],['Alertes à examiner','03','2 priorités élevées'],['Rapports générés','16','30 derniers jours']].map(x=>'<div class="card kpi"><div class="muted">'+x[0]+'</div><div class="val">'+x[1]+'</div><div class="muted">'+x[2]+' · démo</div></div>').join('')+'</div><div class="grid"><section class="card"><div class="ch"><div><h3>Geospatial overview</h3><p>Vue synthétique des zones d’intérêt</p></div>'+btn('Open map ↗',"go('map')")+'</div>'+map()+'</section><section class="card"><div class="ch"><div><h3>Vegetation trend</h3><p>Parcelle démo · indice illustratif</p></div><span class="status">SIMULATED</span></div><div class="chart"><div class="val">0.78 <span style="font-size:11px;color:var(--green)">↗ +12.4%</span></div>'+chart()+'<div class="legend"><span>Juil. 18</span><span>Août 01</span><span>Août 15</span><span>Sept. 12</span></div></div><div class="insight"><b>INSIGHT · SIMULATION</b><br>La tendance illustrée est positive. En production, nuages, disponibilité des images et contexte cultural doivent être considérés.</div></section></div><div class="bottom"><section class="card"><div class="ch"><div><h3>Recent projects</h3><p>Vos espaces de travail</p></div>'+btn('View all',"go('projects')")+'</div><table class="table"><thead><tr><th>Project</th><th>Type</th><th>Status</th></tr></thead><tbody>'+projects.slice(0,3).map(p=>'<tr><td><strong>'+p[0]+'</strong><span class="muted">'+p[2]+'</span></td><td>'+p[1]+'</td><td><span class="status '+(p[3].includes('examiner')?'warn':'')+'">'+p[3]+'</span></td></tr>').join('')+'</tbody></table></section><section class="card"><div class="ch"><div><h3>Intelligence alerts</h3><p>Événements de démonstration</p></div>'+btn('View all',"go('alerts')")+'</div>'+alertList()+'</section></div><div style="margin-top:25px">'+head('EXPLORE THE PLATFORM','One engine. Multiple industries.','Des outils adaptés à chaque métier, construits sur un moteur géospatial commun.')+moduleCards()+'</div>'}

function reportDownload(type){let title=type||'ARGOS INTELL Intelligence Brief';let html='<html><meta charset="utf-8"><title>'+title+'</title><style>body{font:15px Arial;margin:45px;max-width:800px;color:#142033}h1{color:#08765e}.warn{background:#fff3d1;padding:14px;border:1px solid #e4c66f}</style><p>ARGOS INTELL · GEOSPATIAL INTELLIGENCE</p><h1>'+title+'</h1><p>Rapport de démonstration · 15 octobre 2026</p><div class="warn"><b>Important :</b> données synthétiques uniquement, aucune observation satellite réelle.</div><h2>Résumé</h2><p>Ce rapport illustre comment ARGOS INTELL peut comparer des observations géospatiales et présenter les changements nécessitant éventuellement une vérification.</p><h2>Observations</h2><ul><li>Zone d’intérêt : scénario fictif</li><li>Période : deux dates simulées</li><li>Confiance : non applicable aux données synthétiques</li></ul><h2>Limites et prochaines étapes</h2><p>Connecter une source autorisée, valider la qualité et la date des observations, comparer avec l’historique et faire examiner les changements importants.</p></html>';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=title.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Rapport HTML téléchargé. Ouvre-le puis Imprimer → Enregistrer en PDF.')}
