<script>
const icons={overview:'i-grid',map:'i-globe',projects:'i-folder',alerts:'i-bell',reports:'i-file',agri:'i-leaf',mine:'i-pick',infra:'i-route',logistics:'i-truck',environment:'i-tree',water:'i-droplet',integrations:'i-layers',showcase:'i-spark',settings:'i-settings'};
const labels={overview:'Overview',map:'Geospatial explorer',projects:'Projects',alerts:'Alert register',reports:'Intelligence briefs',agri:'Agriculture intelligence',mine:'Mining intelligence',infra:'Infrastructure intelligence',logistics:'Logistics intelligence',environment:'Environmental intelligence',water:'Water intelligence',integrations:'Data sources',showcase:'Platform capabilities',settings:'Workspace settings'};
const sectors=[['agri','i-leaf','01 / LAND & CROPS','Agriculture intelligence','Field-level context for crop monitoring, vegetation trends and seasonal decision support.','Field Doctor'],['mine','i-pick','02 / EXTRACTIVES','Mining & extraction','Site context, multi-date change review and structured monitoring for remote operations.','MineWatch'],['infra','i-route','03 / ASSETS','Infrastructure','Geospatial context for linear assets, construction footprints and remote facilities.','CorridorWatch'],['logistics','i-truck','04 / MOVEMENT','Logistics','Territorial context for corridors, facilities and supply-chain planning.','Route Context'],['environment','i-tree','05 / NATURAL CAPITAL','Environment','Land-cover change, vegetation condition and environmental observation workflows.','LandWatch'],['water','i-droplet','06 / WATER SYSTEMS','Water resources','Water-surface monitoring, seasonal comparison and hydroclimatic context.','WaterWatch']];
let page='overview',projects=[['Koutiala agricultural test area','Agriculture','Sikasso, Mali','Monitoring'],['Remote mine site · sample','Mining','West Africa','Review required'],['Southern trade corridor','Infrastructure','Mali','Monitoring']], reviewed=[];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function icon(n,cls='ico'){return '<svg class="'+cls+'"><use href="#'+(n.startsWith('i-')?n:'i-'+n)+'"/></svg>'}
function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),3000)}
function go(p){page=p;$('#sidebar').classList.remove('open');render()}
$$('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
function button(t,fn,primary=false,ic=''){return '<button class="btn '+(primary?'primary':'')+'" onclick="'+fn+'">'+(ic?icon(ic):'')+t+'</button>'}
function pagehead(k,t,d,actions=''){return '<div class="pagehead"><div><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p class="lede">'+d+'</p></div><div class="actions">'+actions+'</div></div>'}
function banner(){return '<div class="demo-banner"><span class="bannericon">'+icon('i-satellite')+'</span><div><b>DEMONSTRATION ENVIRONMENT</b> &nbsp; Metrics, alert events and map geometries are illustrative. No live satellite observations are connected.</div><div class="banner-right">DATA CLASS / SYNTHETIC</div></div>'}
function miniLine(color='var(--mint)'){return '<svg class="microline" viewBox="0 0 60 20"><polyline points="1,15 9,12 16,14 24,7 31,10 39,4 46,7 53,2 59,4" fill="none" stroke="'+color+'" stroke-width="1.5"/></svg>'}
function kpis(){return '<div class="kpis">'+[['Areas in workspace','12','i-target','+ 3 added','mint'],['Analyses prepared','48','i-chart','Across 6 sectors',''],['Signals to review','03','i-alert','2 priority items','gold'],['Briefs generated','16','i-file','Sample deliverables','']].map((x,i)=>'<div class="kpi animated" style="animation-delay:'+(i*.06)+'s"><div class="kpi-top"><span class="kpi-label">'+x[0]+'</span><span class="kpi-icon">'+icon(x[2])+'</span></div><div class="kpi-value" data-count="'+(i===0?12:i===1?48:i===2?3:16)+'">0</div><div class="kpi-foot"><span class="delta '+(x[4]==='gold'?'gold':'')+'">'+x[3]+'</span>'+miniLine(i===2?'var(--gold)':'var(--mint)')+'</div></div>').join('')+'</div>'}
function mapSvg(){return '<svg class="mapart" viewBox="0 0 650 340" preserveAspectRatio="xMidYMid slice" aria-label="Stylized demonstration map of West Africa"><defs><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#6f9287" opacity=".24"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><path class="land" d="M0 0H650V340H0Z" opacity=".18"/><path class="land" d="M130 -20 200 7 248 2 279 31 327 43 357 70 394 82 414 116 455 134 478 164 465 201 425 216 410 249 380 271 354 317 315 346 264 334 248 300 221 278 210 240 179 215 165 177 128 156 111 112 81 92 91 57Z" opacity=".9"/><path d="M130 -20 200 7 248 2 279 31 327 43 357 70 394 82 414 116 455 134 478 164 465 201 425 216 410 249 380 271 354 317 315 346 264 334 248 300 221 278 210 240 179 215 165 177 128 156 111 112 81 92 91 57Z" fill="url(#dots)"/><path class="river" d="M40 100C130 115 150 158 230 143S330 113 415 162 520 199 650 170"/><path class="road" d="M50 250C160 218 220 202 300 170S430 134 620 65"/><path class="road" d="M130 25C190 110 250 160 335 210S440 270 590 305"/><path class="boundary" d="M183 102 246 81 284 112 275 162 231 187 188 162Z"/><path class="boundary2" d="M354 170 400 152 431 184 416 223 375 232 348 202Z"/><path d="M0 290C140 260 220 305 345 275S510 270 650 235" stroke="#658e83" stroke-width=".8" fill="none" opacity=".5"/><g class="mapnode"><circle cx="233" cy="133" r="20" fill="#16866a" opacity=".1"/><circle cx="233" cy="133" r="10" fill="#16866a" opacity=".15"/><circle cx="233" cy="133" r="4" fill="#7ce4bd" stroke="#0a1b1a" stroke-width="2"/><path d="M233 133v-28h42" stroke="#72cdb0" stroke-width=".8" fill="none"/><text x="280" y="108" class="maplabel">AOI / KOUTIALA</text><text x="280" y="120" class="maptiny">AGRICULTURE · DEMO</text></g><g class="mapnode" style="animation-delay:-2s"><circle cx="385" cy="192" r="16" fill="#d4a64a" opacity=".1"/><circle cx="385" cy="192" r="5" fill="#d4a64a" stroke="#1c1a12" stroke-width="2"/><path d="M385 192v24h48" stroke="#d4a64a" stroke-width=".8" fill="none"/><text x="438" y="219" class="maplabel">ZONE B-04</text><text x="438" y="231" class="maptiny">CHANGE REVIEW</text></g><circle cx="315" cy="248" r="3" fill="#8dbdd0"/><circle cx="315" cy="248" r="8" stroke="#8dbdd0" fill="none" opacity=".5"/><text x="300" y="267" class="maptiny">CORRIDOR / C</text><text x="38" y="312" class="maptiny">SCHEMATIC GEOGRAPHY · NOT FOR NAVIGATION</text></svg>'}
function mapPanel(){return '<section class="panel"><div class="panelhead"><div><div class="paneltitle">'+icon('i-globe')+'Geospatial situation</div><div class="panelsub">WEST AFRICA / MULTI-SECTOR WORKSPACE</div></div><button class="textlink" onclick="go(\'map\')">OPEN EXPLORER '+icon('i-arrow')+'</button></div><div class="mapframe"><div class="scanline"></div><div class="mapui"><span class="mapchip">LAYER / SECTOR OVERVIEW</span><span class="mapchip">AOI / 03</span></div><div class="maptools"><button title="Center map" onclick="toast(\'Map centered on the demo area.\')">'+icon('i-crosshair')+'</button><button title="Layers" onclick="toast(\'Layer selector is a prototype interaction.\')">'+icon('i-layers')+'</button><button title="Expand map" onclick="go(\'map\')">'+icon('i-maximize')+'</button></div>'+mapSvg()+'<div class="mapcaption"><div class="maplegend"><span class="legendkey"><i></i> Monitoring area</span><span class="legendkey"><i class="gold"></i> Review area</span><span class="legendkey"><i style="background:var(--blue)"></i> Corridor point</span></div><div class="mapcoords">12°34′ N / 7°59′ W<br>SCHEMATIC COORDINATES</div></div></div><div class="mapfooter"><span>BASE LAYER / SCHEMATIC TERRAIN</span><span>LAST REFRESH / DEMO SESSION</span><span>EPSG / NOT APPLICABLE</span></div></section>'}
function trendChart(){let v=[38,42,40,48,46,54,52,59,57,63,60,68,70,66,75,79,76,83,80,87],pts=v.map((x,i)=>(10+i*21.4)+','+(142-x*1.25)).join(' ');return '<svg class="chartsvg" viewBox="0 0 430 160" preserveAspectRatio="none"><defs><linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16866a" stop-opacity=".28"/><stop offset="1" stop-color="#16866a" stop-opacity="0"/></linearGradient></defs>'+[30,60,90,120].map(y=>'<line x1="0" y1="'+y+'" x2="430" y2="'+y+'" stroke="#2b3d50" stroke-width=".7" stroke-dasharray="2 5"/>').join('')+'<polygon points="10,153 '+pts+' 417,153" fill="url(#areaFill)"/><polyline points="'+pts+'" fill="none" stroke="#61d8b0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+v.map((x,i)=>i%5===0?'<circle cx="'+(10+i*21.4)+'" cy="'+(142-x*1.25)+'" r="3.2" class="chartpoint"/>':'').join('')+'<circle cx="417" cy="'+(142-87*1.25)+'" r="4" class="chartpoint chartend"/><text x="0" y="158" class="axislabel">JUL 18</text><text x="130" y="158" class="axislabel">AUG 01</text><text x="265" y="158" class="axislabel">AUG 15</text><text x="390" y="158" class="axislabel">SEP 12</text></svg>'}
function trendPanel(){return '<section class="panel"><div class="panelhead"><div><div class="paneltitle">'+icon('i-chart')+'Vegetation signal</div><div class="panelsub">SAMPLE FIELD / TIME SERIES</div></div><span class="badge">SIMULATED</span></div><div class="signalbody"><div class="signalbig"><strong>0.78</strong><span>↗ +12.4% / PERIOD</span></div><div class="signalnote">Illustrative vegetation index · no live imagery</div>'+trendChart()+'<div class="chartlegend"><span>OBSERVATION SERIES</span><span>20 SYNTHETIC SAMPLES</span></div></div><div class="insight"><span class="insighticon">'+icon('i-spark')+'</span><p><b>ANALYST NOTE</b><br>The sample trend rises over this period. In production, crop type, seasonality, cloud cover and image quality must inform interpretation.</p></div></section>'}
function projectsPanel(){return '<section class="panel"><div class="panelhead"><div><div class="paneltitle">'+icon('i-folder')+'Recent workspaces</div><div class="panelsub">PROJECTS / '+String(projects.length).padStart(2,'0')+' IN VIEW</div></div><button class="textlink" onclick="go(\'projects\')">ALL PROJECTS '+icon('i-arrow')+'</button></div><div style="overflow-x:auto"><table class="table"><thead><tr><th>Project</th><th>Sector</th><th class="hide-mobile">Location</th><th>Status</th></tr></thead><tbody>'+projects.slice(0,4).map((p,i)=>'<tr><td><div class="projectname"><span class="projecticon">'+icon(i===0?'i-leaf':i===1?'i-pick':'i-route')+'</span><span>'+p[0]+'<div class="cellsub">PROJECT / AI-'+String(i+21).padStart(3,'0')+'</div></span></div></td><td>'+p[1]+'</td><td class="hide-mobile">'+p[2]+'</td><td><span class="status '+(p[3].includes('Review')?'warn':'')+'">'+p[3]+'</span></td></tr>').join('')+'</tbody></table></div></section>'}
function alertsPanel(){return '<section class="panel"><div class="panelhead"><div><div class="paneltitle">'+icon('i-bell')+'Signal register</div><div class="panelsub">RECENT EVENTS / TRIAGE QUEUE</div></div><button class="textlink" onclick="go(\'alerts\')">VIEW REGISTER '+icon('i-arrow')+'</button></div><div class="alerts">'+alertRows().slice(0,3).join('')+'</div></section>'}
function alertRows(){return [['i-alert','gold','Change review required · B-04','Synthetic multi-date change signal. Validate with source imagery and site context.','PRIORITY / MEDIUM','12 MIN AGO'],['i-chart','red','Unusual vegetation pattern · K-12','Illustrative deviation from a sample seasonal baseline.','PRIORITY / HIGH','1 HOUR AGO'],['i-check','green','Brief prepared · Koutiala','Sample agricultural monitoring brief is ready to inspect.','STATUS / READY','YESTERDAY']].filter((x,i)=>!reviewed.includes(i)).map((x,i)=>'<div class="alertrow"><div class="alertsymbol '+x[1]+'">'+icon(x[0])+'</div><div class="alertmain"><div class="alerttitle">'+x[2]+'</div><div class="alertdesc">'+x[3]+'</div><div class="alertmeta"><span>'+x[4]+'</span><span>'+x[5]+'</span></div></div></div>')}
function moduleCards(){return '<div class="modules">'+sectors.map((s,i)=>'<article class="module animated" style="animation-delay:'+(i*.04)+'s" onclick="go(\''+s[0]+'\')"><div class="moduletop"><div class="moduleicon">'+icon(s[1])+'</div><span class="modulecode">'+s[2]+'</span></div><h3>'+s[3]+'</h3><p>'+s[4]+'</p><div class="modulefoot"><span>'+s[5]+' / EXPLORE</span>'+icon('i-arrow')+'</div></article>').join('')+'</div>'}
function overview(){return pagehead('INTELLIGENCE WORKSPACE','See the territory.<br><em>Understand the change.</em>','A geospatial workspace for turning earth observation and location context into structured, defensible decisions.',button('Create project',"go('projects')",true,'i-plus')+button('Platform overview',"go('showcase')",false,'i-arrow'))+banner()+kpis()+'<div class="layout">'+mapPanel()+trendPanel()+'</div><div class="bottomgrid">'+projectsPanel()+alertsPanel()+'</div><div class="sectiontitle"><div><h2>Sector intelligence</h2><p>Six focused workflows. One geospatial intelligence foundation.</p></div><span class="badge neutral">6 MODULES</span></div>'+moduleCards()+footer()}
function footer(){return '<div class="footerline"><span><strong>ARGOS INTELL</strong> &nbsp; / &nbsp; GEOSPATIAL INTELLIGENCE</span><span>PROTOTYPE BUILD 0.2.0 &nbsp; · &nbsp; DATA CLASS / SYNTHETIC</span><span>BUILT FOR WEST AFRICA</span></div>'}
function mapPage(){return pagehead('GEOSPATIAL WORKSPACE','Explore the area of interest','Review thematic layers and sample zones in a schematic workspace. This is not a live basemap.',button('Layer settings',"toast('Layer controls are a prototype interaction.')",false,'i-layers')+button('Center view',"toast('View centered on the illustrative AOI.')",true,'i-crosshair'))+banner()+'<div class="panel">'+mapPanel().replace('<section class="panel">','').replace('</section>','')+'</div><div class="bottomgrid" style="margin-top:16px">'+projectsPanel()+alertsPanel()+'</div>'+footer()}
function projectPage(){return pagehead('WORKSPACE MANAGEMENT','Projects','Organize areas of interest and sector-specific analysis workflows.',button('New project',"$('#newname').focus()",true,'i-plus'))+'<div class="panel"><div class="panelhead"><div><div class="paneltitle">'+icon('i-folder')+'Project register</div><div class="panelsub">DEMO PROJECTS / SESSION ONLY</div></div><div class="searchbox">'+icon('i-search')+'<input placeholder="Search projects…" oninput="filterProjects(this.value)"></div></div><div style="overflow-x:auto"><table class="table"><thead><tr><th>Project name</th><th>Sector</th><th>Location</th><th>Status</th></tr></thead><tbody id="projectrows">'+projectRows()+'</tbody></table></div></div><div class="panel" style="margin-top:16px"><div class="panelhead"><div><div class="paneltitle">'+icon('i-plus')+'Create a project</div><div class="panelsub">LOCAL PROTOTYPE ACTION / NO SERVER WRITE</div></div></div><form class="panelbody" style="padding:17px" onsubmit="createProject(event)"><div class="formgrid"><div class="field"><label>PROJECT NAME</label><input id="newname" required placeholder="e.g. Sikasso agricultural area"></div><div class="field"><label>SECTOR</label><select id="newtype"><option>Agriculture</option><option>Mining</option><option>Infrastructure</option><option>Logistics</option><option>Environment</option><option>Water resources</option></select></div><div class="field"><label>LOCATION</label><input id="newloc" placeholder="Region, country"></div><div class="field"><label>INTERNAL REFERENCE (OPTIONAL)</label><input placeholder="Project code"></div></div><button class="btn primary">'+icon('i-plus')+'Create demo project</button></form></div>'+footer()}
function projectRows(){return projects.map((p,i)=>'<tr><td><div class="projectname">'+icon(i===0?'i-leaf':i===1?'i-pick':'i-route','ico')+'<span>'+p[0]+'<div class="cellsub">ARGOS / '+String(i+21).padStart(4,'0')+'</div></span></div></td><td>'+p[1]+'</td><td>'+p[2]+'</td><td><span class="status">'+p[3]+'</span></td></tr>').join('')}
function filterProjects(q){$('#projectrows').innerHTML=projects.filter(p=>p.join(' ').toLowerCase().includes(q.toLowerCase())).map((p,i)=>'<tr><td><div class="projectname">'+p[0]+'</div></td><td>'+p[1]+'</td><td>'+p[2]+'</td><td><span class="status">'+p[3]+'</span></td></tr>').join('')||'<tr><td colspan="4" class="empty">No matching projects found.</td></tr>'}
function createProject(e){e.preventDefault();projects.unshift([$('#newname').value,$('#newtype').value,$('#newloc').value||'Location not specified','Created']);toast('Demo project added to this session. It will reset when the page reloads.');render()}
function alertPage(){return pagehead('MONITORING & TRIAGE','Signal register','A structured queue for observations that may require analyst review.',button('Mark all reviewed',"reviewAll()",false,'i-check'))+banner()+'<div class="panel"><div class="panelhead"><div><div class="paneltitle">'+icon('i-bell')+'Recent signals</div><div class="panelsub">SYNTHETIC EVENTS / NOT LIVE DETECTIONS</div></div><span class="badge gold">'+(3-reviewed.length)+' OPEN</span></div><div class="alerts">'+(alertRows().join('')||'<div class="empty">All demonstration signals have been reviewed.</div>')+'</div></div><div class="insight" style="margin-top:15px;border:1px solid #55482e"><span class="insighticon">'+icon('i-alert')+'</span><p><b>INTERPRETATION STANDARD</b><br>A detected change is a prompt for investigation, not proof of a cause. Operational decisions require source validation, temporal context and human review.</p></div>'+footer()}
function reviewAll(){reviewed=[0,1,2];render();toast('Demo signals marked as reviewed.')}
function reportDownload(title='ARGOS INTELL · Intelligence brief'){let h='<!doctype html><html><meta charset="utf-8"><title>'+title+'</title><style>body{font:15px Arial;color:#142337;margin:48px;max-width:850px;line-height:1.65}h1{font-size:28px}h1,b{color:#16866a}.top{font-size:10px;letter-spacing:2px}.warn{background:#fbf3df;border:1px solid #ddc17b;padding:14px;margin:20px 0}footer{border-top:1px solid #ddd;margin-top:35px;padding-top:12px;font-size:10px;color:#667}</style><p class="top">ARGOS INTELL / GEOSPATIAL INTELLIGENCE</p><h1>'+title+'</h1><p>Demonstration brief · 15 October 2026</p><div class="warn"><b>Data notice:</b> This brief is generated from synthetic demonstration data. It contains no verified live satellite observations.</div><h2>Executive summary</h2><p>This sample illustrates how ARGOS INTELL can structure geospatial observations, highlight potential changes and communicate context and limitations to decision-makers.</p><h2>Illustrative observations</h2><ul><li>Area of interest: fictional demonstration zone</li><li>Comparison: synthetic multi-date sample</li><li>Confidence: not applicable to synthetic data</li></ul><h2>Recommended workflow</h2><ol><li>Connect an authorized and documented source.</li><li>Validate acquisition date, resolution, cloud conditions and geometry.</li><li>Compare against an appropriate baseline.</li><li>Review signals with local context before acting.</li></ol><footer>ARGOS INTELL · Prototype report · Not for operational decisions</footer></html>';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download=title.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('Sample HTML brief downloaded. Open it and use Print → Save as PDF if needed.')}
function reportsPage(){return pagehead('DECISION SUPPORT DELIVERABLES','Intelligence briefs','Structured outputs designed to document observations, caveats and recommended follow-up.',button('Generate sample brief',"reportDownload()",true,'i-download'))+banner()+'<div class="panel"><div class="panelhead"><div><div class="paneltitle">'+icon('i-file')+'Sample report library</div><div class="panelsub">HTML DOWNLOADS / PRINT-TO-PDF READY</div></div><span class="badge neutral">3 TEMPLATES</span></div>'+[['Agricultural monitoring brief','Crop / vegetation trend context','i-leaf'],['Site change review','Multi-date observation summary','i-pick'],['Corridor context note','Infrastructure and route context','i-route']].map(x=>'<div class="alertrow" style="padding:15px 17px"><div class="projecticon">'+icon(x[2])+'</div><div class="alertmain"><div class="alerttitle">'+x[0]+'</div><div class="alertdesc">'+x[1]+'</div><div class="cellsub">TEMPLATE / SYNTHETIC DATA</div></div>'+button('Download',"reportDownload('"+x[0]+"')",false,'i-download')+'</div>').join('')+'</div>'+footer()}
function sectorPage(key){let s=sectors.find(x=>x[0]===key);let data={agri:['0.78','Vegetation signal · illustrative','The sample trend rises over the period. Index values alone do not diagnose crop disease or water stress.',['Field boundary management','Vegetation index time series','Seasonal baseline comparison','Weather and crop-calendar context','Campaign reporting']],mine:['02','Zones for review · illustrative','A change signal is a reason to inspect source observations, not proof of illegal activity or an incident.',['Site boundary and buffer zones','Multi-date image comparison','Visible change register','Operations context layers','Site monitoring brief']],infra:['03','Asset segments · illustrative','Satellite imagery can complement inspections, but does not replace real-time telemetry or field measurements.',['Linear asset mapping','Construction footprint context','Change monitoring','Asset and facility registry','Periodic monitoring report']],logistics:['04','Context areas · illustrative','Satellite imagery alone does not provide live traffic or current vehicle locations.',['Corridor and facility context','Territorial access analysis','Land-use change context','Future GPS and routing integration','Operational context note']],environment:['02','Change areas · illustrative','Cloud cover, sensor resolution, seasonality and classification methods affect change detection.',['Land-cover change review','Vegetation condition trends','Multi-date comparison','Environmental area register','Monitoring brief']],water:['−8%','Surface area change · illustrative','Observed water surface area does not directly measure depth, volume or water quality.',['Water body delineation','Seasonal surface comparison','Historical water extent','Rainfall context integration','Water resource brief']]}[key];return pagehead('SECTOR WORKSPACE / '+s[2],s[3],s[4],button('Generate brief',"reportDownload('"+s[5]+"')",true,'i-download')+button('All sectors',"go('showcase')",false,'i-grid'))+banner()+'<div class="kpis"><div class="kpi"><div class="kpi-top"><span class="kpi-label">'+data[1]+'</span><span class="kpi-icon">'+icon(s[1])+'</span></div><div class="kpi-value">'+data[0]+'</div><div class="kpi-foot">SYNTHETIC INDICATOR</div></div><div class="kpi"><div class="kpi-top"><span class="kpi-label">Areas of interest</span><span class="kpi-icon">'+icon('i-target')+'</span></div><div class="kpi-value">04</div><div class="kpi-foot">ILLUSTRATIVE ONLY</div></div><div class="kpi"><div class="kpi-top"><span class="kpi-label">Observations</span><span class="kpi-icon">'+icon('i-satellite')+'</span></div><div class="kpi-value">18</div><div class="kpi-foot">SAMPLE RECORDS</div></div><div class="kpi"><div class="kpi-top"><span class="kpi-label">Source status</span><span class="kpi-icon">'+icon('i-layers')+'</span></div><div class="kpi-value" style="font-size:19px">DEMO</div><div class="kpi-foot">NO LIVE API CONNECTED</div></div></div><div class="layout">'+mapPanel()+trendPanel()+'</div><div class="bottomgrid"><section class="panel"><div class="panelhead"><div><div class="paneltitle">'+icon('i-layers')+'Workflow capabilities</div><div class="panelsub">CURRENT DEMO / FUTURE INTEGRATION</div></div></div><div class="alerts">'+data[3].map((x,i)=>'<div class="alertrow"><div class="alertsymbol '+(i<2?'green':'')+'">'+icon(i<2?'i-check':'i-clock')+'</div><div class="alertmain"><div class="alerttitle">'+x+'</div><div class="alertdesc">'+(i<2?'Represented in the interactive prototype.':'Requires source integration and product development.')+'</div></div><span class="badge '+(i<2?'':'neutral')+'">'+(i<2?'DEMO':'ROADMAP')+'</span></div>').join('')+'</div></section><section class="panel"><div class="panelhead"><div><div class="paneltitle">'+icon('i-spark')+'Analyst interpretation</div><div class="panelsub">DECISION SUPPORT / LIMITATIONS</div></div></div><div class="signalbody"><p style="font-size:11px;line-height:1.9;color:#a0b2c1;margin:0 0 14px">'+data[2]+'</p><div class="insight" style="padding:12px;margin:0;border:1px solid #4d432d"><span class="insighticon">'+icon('i-alert')+'</span><p><b>VALIDATION REQUIRED</b><br>Real analysis requires a dated source, spatial reference, quality assessment and domain context.</p></div></div></section></div>'+footer()}
function integrations(){return pagehead('DATA ARCHITECTURE','Sources & integrations','An explicit view of the systems required to move from prototype to production.')+'<div class="demo-banner"><span class="bannericon">'+icon('i-alert')+'</span><div><b>NO LIVE DATA CONNECTIONS</b> &nbsp; All providers below are status-labelled honestly. No API keys are stored in this frontend.</div></div><div class="panel"><div class="panelhead"><div><div class="paneltitle">'+icon('i-layers')+'Integration register</div><div class="panelsub">SOURCE / ROLE / STATUS</div></div></div>'+[['i-satellite','EOS Data Analytics','Satellite imagery, vegetation indices, statistics and image search','Planned · API not connected'],['i-globe','Geospatial basemap','Reference layers, boundaries and map context','Schematic map only'],['i-chart','Weather & climate','Historical weather and forecast context','Planned'],['i-folder','Secure data backend','Project persistence, organizations and access control','Not implemented'],['i-bell','Notifications','Alert delivery, email and in-app activity','Not implemented']].map(x=>'<div class="alertrow" style="padding:16px 18px"><div class="projecticon">'+icon(x[0])+'</div><div class="alertmain"><div class="alerttitle">'+x[1]+'</div><div class="alertdesc">'+x[2]+'</div></div><span class="badge neutral">'+x[3]+'</span></div>').join('')+'</div><div class="insight" style="margin-top:15px;border:1px solid #2d5148"><span class="insighticon" style="color:var(--mint)">'+icon('i-check')+'</span><p><b>SECURITY PRINCIPLE</b><br>Provider credentials must be stored server-side and accessed through a controlled backend, never embedded in public browser code.</p></div>'+footer()}
function showcase(){return pagehead('PLATFORM CAPABILITIES','One intelligence layer.<br><em>Six operational lenses.</em>','ARGOS INTELL is designed to connect earth observation, spatial context and sector workflows into traceable intelligence products.')+banner()+moduleCards()+'<div class="sectiontitle"><div><h2>From observation to decision</h2><p>A repeatable workflow that keeps uncertainty visible.</p></div></div><div class="modules">'+[['01','i-satellite','Observe','Connect authorized imagery and contextual data.'],['02','i-layers','Compare','Assess change across dates and reference baselines.'],['03','i-spark','Interpret','Add sector context, confidence and limitations.'],['04','i-file','Communicate','Deliver a structured brief for human review.']].map(x=>'<article class="module"><div class="moduletop"><div class="moduleicon">'+icon(x[1])+'</div><span class="modulecode">STEP / '+x[0]+'</span></div><h3>'+x[2]+'</h3><p>'+x[3]+'</p></article>').join('')+'</div><div class="insight" style="margin-top:16px;border:1px solid #4d432d"><span class="insighticon">'+icon('i-alert')+'</span><p><b>INVESTOR DEMONSTRATION NOTICE</b><br>This is a frontend MVP. Data is synthetic; integrations, user accounts, persistence, production analytics and automated alert pipelines remain to be implemented.</p></div>'+footer()}
function settings(){return pagehead('ADMINISTRATION','Workspace settings','Prototype configuration and implementation status.')+'<div class="panel"><div class="panelhead"><div><div class="paneltitle">'+icon('i-settings')+'Environment details</div><div class="panelsub">CURRENT BUILD / STATIC FRONTEND</div></div><span class="badge">ONLINE</span></div><div class="alerts">'+[['Brand system','Midnight navy, emerald and Sahel gold'],['Interaction model','Responsive single-page prototype'],['Data mode','Synthetic demonstration values'],['Project persistence','Browser session only; resets on reload'],['Authentication','Not implemented'],['Satellite data','No live imagery or EOSDA API connected']].map(x=>'<div class="alertrow"><div class="alertmain"><div class="alerttitle">'+x[0]+'</div><div class="alertdesc">'+x[1]+'</div></div></div>').join('')+'</div></div>'+footer()}
function render(){ $('#crumb').textContent=labels[page]||'Overview';$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let c=$('#content');c.innerHTML='<div class="pagecontent">'+(page==='overview'?overview():page==='map'?mapPage():page==='projects'?projectPage():page==='alerts'?alertPage():page==='reports'?reportsPage():sectors.some(s=>s[0]===page)?sectorPage(page):page==='integrations'?integrations():page==='showcase'?showcase():settings())+'</div>';window.scrollTo({top:0,behavior:'smooth'});c.querySelectorAll('[data-count]').forEach(el=>{let target=+el.dataset.count,start=performance.now(),dur=650;function tick(now){let p=Math.min(1,(now-start)/dur);el.textContent=Math.round(target*(1-Math.pow(1-p,3))).toString().padStart(2,'0');if(p<1)requestAnimationFrame(tick)}requestAnimationFrame(tick)})}
render();
</script></body></html>
